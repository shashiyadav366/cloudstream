name: Squash Changes After Base Commit

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  squash:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: master

      - name: Create squashed commit
        run: |
          BASE="a005b92dd3b75914bec7a56b14cde20c361a5a47"
          CURRENT="bec0a2c51b4099c21d66e887dbd5e968fbc73714"

          echo "Base:"
          git show --no-patch --oneline "$BASE"

          echo "Current:"
          git show --no-patch --oneline "$CURRENT"

          # Configure Git identity for the new commit
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          # Make the working tree exactly match CURRENT
          git read-tree "$CURRENT"

          # Move HEAD to BASE
          git reset "$BASE"

          # Stage the complete final state
          git add -A

          # Create commit message
          cat > /tmp/commit_message <<'EOF'
          Auto Update App

          
          
          
          EOF

          # Create ONE new commit on top of BASE
          git commit -F /tmp/commit_message

          echo "Created commit:"
          git log -2 --oneline

      - name: Force update master
        run: |
          git push origin HEAD:master --force
          
